<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                  "secondary": "#6b38d4",
                  "on-error-container": "#93000a",
                  "secondary-container": "#8455ef",
                  "primary-container": "#38bdf8",
                  "primary-fixed-dim": "#7bd0ff",
                  "inverse-surface": "#213145",
                  "secondary-fixed": "#e9ddff",
                  "error-container": "#ffdad6",
                  "surface-variant": "#d3e4fe",
                  "surface-bright": "#f8f9ff",
                  "on-tertiary": "#ffffff",
                  "tertiary": "#5c5f61",
                  "surface-container-lowest": "#ffffff",
                  "on-secondary-fixed-variant": "#5516be",
                  "on-primary-fixed": "#001e2c",
                  "tertiary-fixed-dim": "#c4c7c9",
                  "on-background": "#0b1c30",
                  "on-tertiary-container": "#414546",
                  "surface": "#f8f9ff",
                  "primary-fixed": "#c4e7ff",
                  "outline": "#6e7980",
                  "on-secondary": "#ffffff",
                  "outline-variant": "#bdc8d1",
                  "on-secondary-fixed": "#23005c",
                  "on-primary-container": "#004965",
                  "inverse-on-surface": "#eaf1ff",
                  "surface-container-low": "#eff4ff",
                  "on-primary-fixed-variant": "#004c69",
                  "secondary-fixed-dim": "#d0bcff",
                  "error": "#ba1a1a",
                  "tertiary-fixed": "#e0e3e5",
                  "primary": "#00668a",
                  "surface-container-highest": "#d3e4fe",
                  "tertiary-container": "#afb2b4",
                  "on-tertiary-fixed": "#191c1e",
                  "inverse-primary": "#7bd0ff",
                  "on-tertiary-fixed-variant": "#444749",
                  "on-primary": "#ffffff",
                  "on-secondary-container": "#fffbff",
                  "surface-dim": "#cbdbf5",
                  "on-error": "#ffffff",
                  "surface-container": "#e5eeff",
                  "on-surface-variant": "#3e484f",
                  "background": "#f8f9ff",
                  "surface-container-high": "#dce9ff",
                  "surface-tint": "#00668a",
                  "on-surface": "#0b1c30"
          },
          "borderRadius": {
                  "DEFAULT": "0.25rem",
                  "lg": "0.5rem",
                  "xl": "0.75rem",
                  "full": "9999px"
          },
          "spacing": {
                  "margin-desktop": "64px",
                  "unit": "8px",
                  "margin-mobile": "16px",
                  "container-max": "1440px",
                  "gutter": "24px"
          },
          "fontFamily": {
                  "h3": ["Space Grotesk"],
                  "h2": ["Space Grotesk"],
                  "h1": ["Space Grotesk"],
                  "body-md": ["Inter"],
                  "body-lg": ["Inter"],
                  "label-sm": ["Space Grotesk"]
          },
          "fontSize": {
                  "h3": ["2rem", {"lineHeight": "1.2", "letterSpacing": "-0.03em", "fontWeight": "600"}],
                  "h2": ["3rem", {"lineHeight": "1.2", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                  "h1": ["4.5rem", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                  "body-md": ["1rem", {"lineHeight": "1.6", "letterSpacing": "0px", "fontWeight": "400"}],
                  "body-lg": ["1.125rem", {"lineHeight": "1.7", "letterSpacing": "0.01em", "fontWeight": "400"}],
                  "label-sm": ["0.75rem", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500"}]
          }
        },
      },
    }
  </script>
<style>
    .nebula-bg {
      background: radial-gradient(circle at 20% 30%, #38bdf8 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, #8455ef 0%, transparent 40%),
                  radial-gradient(circle at 50% 50%, #c4e7ff 0%, #f8f9ff 100%);
      background-attachment: fixed;
    }
    .glass-surface {
      backdrop-filter: blur(40px);
      background: rgba(255, 255, 255, 0.4);
      box-shadow: inset 0px 1px 1px rgba(255, 255, 255, 0.8), 
                  0px 0px 40px rgba(56, 189, 248, 0.1);
    }
    .rim-light {
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .logo-glow {
      filter: drop-shadow(0 0 30px rgba(56, 189, 248, 0.6));
    }
    .floating-anim {
      animation: drift 6s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body class="nebula-bg min-h-screen flex flex-col items-center justify-center font-body-md overflow-hidden p-margin-mobile md:p-margin-desktop">
<!-- Atmospheric Background Elements -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-primary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-[600px] h-[600px] bg-secondary-container/10 rounded-full blur-[150px]"></div>
</div>
<main class="relative z-10 w-full max-w-[1200px] flex flex-col items-center">
<!-- Massive Logo Branding -->
<div class="mb-12 flex flex-col items-center gap-4 floating-anim">
<div class="w-32 h-32 md:w-48 md:h-48 flex items-center justify-center rounded-[40px] glass-surface rim-light logo-glow">
<span class="text-[80px] md:text-[120px] font-h1 text-primary-container select-none">I</span>
</div>
<h1 class="font-h2 text-on-background text-center">IntoreAI</h1>
<p class="font-body-lg text-on-surface-variant tracking-widest uppercase opacity-70">Transcendent Portal</p>
</div>
<!-- Main Entry Card -->
<div class="glass-surface rim-light rounded-[48px] p-8 md:p-12 w-full max-w-xl shadow-2xl transition-all duration-500 hover:shadow-[0px_0px_60px_rgba(56,189,248,0.25)]">
<!-- High-Tech Sliding Switch -->
<div class="relative flex items-center p-1.5 mb-10 bg-on-background/5 rounded-full rim-light overflow-hidden">
<div class="absolute inset-y-1.5 left-1.5 w-[calc(50%-6px)] bg-primary-container/90 rounded-full shadow-lg transition-all duration-500 transform translate-x-0" id="switch-glider"></div>
<button class="relative z-10 flex-1 py-3 font-label-sm text-on-primary text-center transition-colors duration-300">Recruiter</button>
<button class="relative z-10 flex-1 py-3 font-label-sm text-on-surface-variant text-center transition-colors duration-300">Talent</button>
</div>
<!-- Form Section -->
<form class="space-y-6">
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant ml-4">Credential Identity</label>
<div class="relative group">
<input class="w-full bg-white/30 rim-light rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-primary-container transition-all duration-300 placeholder:text-on-surface-variant/40 font-body-md" placeholder="nexus-id@intore.ai" type="email"/>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-primary opacity-50 group-focus-within:opacity-100 transition-opacity">alternate_email</span>
</div>
</div>
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant ml-4">Neural Key</label>
<div class="relative group">
<input class="w-full bg-white/30 rim-light rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-primary-container transition-all duration-300 placeholder:text-on-surface-variant/40 font-body-md" placeholder="••••••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-primary opacity-50 group-focus-within:opacity-100 transition-opacity">key</span>
</div>
</div>
<div class="flex items-center justify-between px-2 pt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-5 h-5 rounded bg-white/20 border-white/50 text-primary-container focus:ring-offset-0 focus:ring-primary-container transition-all" type="checkbox"/>
<span class="font-label-sm text-on-surface-variant group-hover:text-primary transition-colors">Keep Session Active</span>
</label>
<a class="font-label-sm text-primary hover:text-secondary-container transition-colors" href="#">Recover Access</a>
</div>
<button class="w-full bg-primary-container hover:bg-primary-container/80 text-on-primary-container font-h3 py-6 rounded-[24px] shadow-[0px_10px_30px_rgba(56,189,248,0.3)] hover:shadow-[0px_15px_40px_rgba(56,189,248,0.5)] active:scale-95 transition-all duration-300 flex items-center justify-center gap-3 mt-8" type="button">
<span>Initialize Session</span>
<span class="material-symbols-outlined">bolt</span>
</button>
</form>
<!-- Footer Context -->
<div class="mt-10 pt-8 border-t border-on-background/5 text-center">
<p class="font-body-md text-on-surface-variant">New to the ecosystem? 
          <a class="font-semibold text-primary underline decoration-primary/30 underline-offset-4 hover:decoration-primary" href="#">Request Interface Access</a>
</p>
</div>
</div>
<!-- Legal/Nav Floating Links -->
<div class="mt-12 flex gap-8 opacity-40 hover:opacity-100 transition-opacity duration-500">
<a class="font-label-sm text-on-background hover:text-primary transition-colors" href="#">Network Status</a>
<a class="font-label-sm text-on-background hover:text-primary transition-colors" href="#">Privacy Protocols</a>
<a class="font-label-sm text-on-background hover:text-primary transition-colors" href="#">Contact Intelligence</a>
</div>
</main>
<!-- Side Navigation Component (Suppressed per transactional screen rule, but available as logic anchor) -->
<!-- Contextual Shell Suppression: Since this is a Transactional/Portal screen, the SideNavBar and FAB are omitted to prioritize focus. -->
<!-- Texture & Grain Overlay -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-50 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
</body></html>
